name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N) builds the Beacon for linux/macOS
# x86_64/aarch64 and the APK and AAB (which pin those Beacon binaries) signed
# with the upload key, publishes them on GitHub Releases, and uploads the AAB
# to Play internal testing once the PLAY_UPLOAD_ENABLED variable is "true"
# (ticket 09).
# workflow_dispatch builds and checks an existing tag without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (nothing is published)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.1.12297006
  CARGO_ABOUT_VERSION: 0.9.3
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The Beacon for linux/macOS x86_64/aarch64. The app built below pins
  # exactly these binaries and their SHA-256s (ticket 26).
  beacon:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            targets: linux-x86_64 linux-aarch64
          - runner: macos-latest
            targets: macos-x86_64 macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
      - name: Build the Beacon
        if: runner.os == 'macOS'
        run: sh scripts/build-beacon.sh dist/beacon ${{ matrix.targets }}
      - name: Build Linux Beacon with musl C toolchains
        if: runner.os == 'Linux'
        run: |
          docker build --platform linux/amd64 -t aries-beacon-build -f scripts/beacon-build.Dockerfile .
          mkdir -p dist/beacon target/beacon-build
          docker run --rm --name aries-beacon-build --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/build/cargo-home -e CARGO_TARGET_DIR=/build/target \
            -v "$PWD:/work:ro" -v "$PWD/target/beacon-build:/build" \
            -v "$PWD/dist/beacon:/out" aries-beacon-build \
            sh scripts/build-beacon.sh /out ${{ matrix.targets }}
      - name: Run the static Beacon without glibc
        if: runner.os == 'Linux'
        run: |
          docker run --rm --name aries-beacon-smoke \
            -v "$PWD/dist/beacon:/beacon:ro" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
            /beacon/aries-beacon-linux-x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.runner }}
          path: dist/beacon/

  build:
    needs: beacon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      name: ${{ steps.build.outputs.name }}
      prerelease: ${{ steps.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag is a release version
        run: scripts/release-version.sh "$TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: NDK, cargo-ndk and cargo-about
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: beacon-*
          merge-multiple: true
          path: dist/beacon
      - name: Pin the Beacon release
        run: |
          chmod 755 dist/beacon/aries-beacon-*
          scripts/beacon-manifest.sh "$TAG" dist/beacon
          echo "ARIES_BEACON_MANIFEST=$PWD/dist/beacon/beacon-release.json" >> "$GITHUB_ENV"
          dist/beacon/aries-beacon-linux-x86_64 --version
      - name: The core pins all four Beacon binaries
        run: ARIES_BEACON_EXPECT_ALL=1 cargo test -p aries-core --lib pins_the_manifest_the_release_pipeline_built
      - uses: gradle/actions/setup-gradle@v4
      - name: Secrets (upload key, google-services.json)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          for s in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_PASSWORD ANDROID_UPLOAD_KEY_ALIAS; do
            eval "v=\${$s:-}"
            [ -n "$v" ] || { echo "::error::secret $s is not set"; exit 1; }
          done
          keystore="$RUNNER_TEMP/aries-upload.p12"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "ARIES_UPLOAD_KEYSTORE=$keystore"
            echo "ARIES_UPLOAD_STORE_PASSWORD=$ANDROID_UPLOAD_STORE_PASSWORD"
            echo "ARIES_UPLOAD_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD"
            echo "ARIES_UPLOAD_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS"
          } >> "$GITHUB_ENV"
          # Read by android/app/build.gradle.kts (Firebase resource values for FCM).
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi
      - name: Build, verify signature, check Play policy
        id: build
        env:
          # The Relay the app pushes through (repo variable; empty: push unavailable).
          ARIES_RELAY_URL: ${{ vars.ARIES_RELAY_URL }}
        run: scripts/build-release.sh "$TAG" dist
      - uses: actions/upload-artifact@v4
        with:
          name: aries-release
          path: dist/
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.build.outputs.name }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          gh release create "$TAG" --verify-tag --title "Aries $NAME" --generate-notes $flags \
            "dist/aries-$NAME.apk" dist/SHA256SUMS \
            dist/third-party-notices-rust.txt dist/third-party-notices-android.json \
            dist/beacon/aries-beacon-linux-x86_64 dist/beacon/aries-beacon-linux-aarch64 \
            dist/beacon/aries-beacon-macos-x86_64 dist/beacon/aries-beacon-macos-aarch64 \
            dist/beacon/beacon-SHA256SUMS
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/aries-upload.p12" android/app/google-services.json

  play:
    needs: build
    if: github.event_name == 'push' && vars.PLAY_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aries-release
          path: dist
      - name: Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.shiroel.aries
          releaseFiles: dist/aries-${{ needs.build.outputs.name }}.aab
          releaseName: ${{ needs.build.outputs.name }}
          track: internal
          # A Play app that was never published only accepts draft releases.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
