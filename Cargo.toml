[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/beacon",
    "crates/test-support",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
aries-protocol = { path = "crates/protocol" }
aries-test-support = { path = "crates/test-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "net"] }
uniffi = "0.32.2"
# ring instead of the default aws-lc-rs: ring cross-compiles to Android with just the NDK.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
