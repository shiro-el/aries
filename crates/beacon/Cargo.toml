[package]
name = "aries-beacon"
description = "The Aries program that runs on a Host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aries-protocol.workspace = true
russh.workspace = true
tokio.workspace = true
rand = { version = "0.10", features = ["thread_rng"] }
base64 = "0.22"
pulldown-cmark = { version = "0.10.3", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
subtle = "2.6"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tempfile.workspace = true
zstd = { version = "0.13.3", default-features = false }
# rustls with ring and bundled web PKI roots: no system TLS libraries needed on the Host.
ureq = "3.5.1"

[dev-dependencies]
aries-test-support.workspace = true
