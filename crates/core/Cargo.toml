[package]
name = "aries-core"
description = "The phone core: SSH, herdr-core client and Host model, exposed to the app through uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "aries_core"
crate-type = ["lib", "cdylib"]

[dependencies]
aries-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true
russh.workspace = true
rand = { version = "0.10", features = ["thread_rng"] }
qrcode = { version = "0.14.1", default-features = false }
alacritty_terminal = { version = "0.26.0", default-features = false }
sha2 = "0.11"

[dev-dependencies]
aries-test-support.workspace = true
rqrr = "0.11.0"
tempfile.workspace = true
